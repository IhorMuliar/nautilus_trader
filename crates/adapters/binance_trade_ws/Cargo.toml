[package]
name = "binance-trade-ws"
version = "0.49.0"
edition = "2024"
rust-version = "1.88.0"
authors = ["Ihor Muliar"]
license = "LGPL-3.0"
readme = "README.md"
description = "High-performance Binance WebSocket Trade API client for NautilusTrader"
documentation = "https://nautilustrader.io/docs"
repository = "https://github.com/nautechsystems/nautilus_trader"
homepage = "https://nautilustrader.io"

[lib]
name = "binance_trade_ws"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["pyo3", "pyo3-async-runtimes"]
extension-module = ["pyo3/extension-module"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
url = "2.5"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
thiserror = "1.0"
tracing = "0.1"
futures-util = "0.3"
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1.0", features = ["v4"] }

nautilus-cryptography = { workspace = true }
ahash = { workspace = true }
anyhow = { workspace = true }

pyo3 = { workspace = true, features = ["macros", "chrono"], optional = true }
pyo3-async-runtimes = { workspace = true, features = ["tokio"], optional = true }

[dev-dependencies]
tokio-test = "0.4" 